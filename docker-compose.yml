version: '3.9'

# TGX Waste Coin - Docker Compose
# Sprint 26 - PT Jwalita Energi Trenggalek
# Usage: docker compose up --build

services:
  # ─────────────── Database ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: tgx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgx_production
      POSTGRES_USER: tgx_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgx_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgx_user -d tgx_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────── Cache ───────────────
  redis:
    image: redis:7-alpine
    container_name: tgx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────── Backend ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tgx_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql://tgx_user:${POSTGRES_PASSWORD:-tgx_dev_password}@postgres:5432/tgx_production
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - uploads_data:/app/src/uploads
      - logs_data:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ─────────────── Frontend ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tgx_frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ─────────────── Nginx (Reverse Proxy) ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tgx_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
  nginx_logs:

networks:
  default:
    name: tgx_network
